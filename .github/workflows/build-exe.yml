name: Build and Release Windows EXE

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  workflow_dispatch: {}

permissions:
  contents: write   # needed to create/update releases

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --noconfirm build_exe.spec

      - name: Upload build artifact (backup / per-run download)
        uses: actions/upload-artifact@v4
        with:
          name: BleachAutoFarm-windows-exe
          path: dist/BleachAutoFarm.exe
          retention-days: 30

      - name: Publish "latest" GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: |
            Auto-built from commit ${{ github.sha }}.
            Download `BleachAutoFarm.exe` below and run it with the game open.
          make_latest: true
          files: dist/BleachAutoFarm.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
